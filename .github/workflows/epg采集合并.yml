name: epg酒店源采集合并

on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 关键：给 GITHUB_TOKEN 写权限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests futures eventlet pytz lxml

      - name: Run iptv
        run: python ${{ github.workspace }}/epg.py

      - name: 提交更改
        run: |
          git config --local user.email "actions@126.com"
          git config --local user.name "GitHub Action"
          git add *.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update EPG - $(date '+%Y-%m-%d %H:%M')"
          git push -f
