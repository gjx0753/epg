name: epg酒店源采集合并

on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 允许 git push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'      # 需要仓库里有 requirements.txt 或 pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EPG collector
        run: python ${{ github.workspace }}/epg.py

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@126.com"
          git config --local user.name "GitHub Action"
          git add *.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update EPG - $(date '+%Y-%m-%d %H:%M')"
          git push -f
